[project]
name = "asyncolabs"
version = "0.1.0"
description = "Cursor-paginated async HTTP client with bounded retries — the 09.3.3 lab project"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
